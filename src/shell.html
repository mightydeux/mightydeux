<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>걸그룹 메이커</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#f0c860;--gold2:#a07a2c;--wine:#4a1430;--ink:#283050;--line:#384878;--line2:#8aa0d8;--pink:#ff7eb6;--rose:#d0306a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#14050c;font-family:var(--fb),sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;overscroll-behavior:none}
body{display:flex;justify-content:center}
button{font-family:inherit;cursor:pointer;color:inherit}
.px{font-family:var(--fn),monospace}
#app{width:100%;max-width:440px;min-height:100%;position:relative;display:flex;flex-direction:column;gap:6px;padding:8px 8px 160px;
 background:radial-gradient(circle at 12px 12px,rgba(240,200,96,.10) 2px,transparent 3px) 0 0/24px 24px,linear-gradient(#5a1838,#2a0818)}
/* 포켓몬 박스 + 프메 금테 */
.pk{background:#fffdf6;border:3px solid var(--line);border-radius:8px;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 4px var(--line2),0 0 0 2px var(--gold),0 0 0 4px #2a0818}
#hdr{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:7px 12px}
#hdr .nm{font-family:var(--fh);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdr .stg{font-family:var(--fh);font-size:13px;color:var(--rose);text-align:right;align-self:center}
#hdr .dt{font-size:12.5px;color:#5a6080}
#hdr .gold{font-family:var(--fn);font-size:14px;color:#a07a00;text-align:right}
#scene{position:relative;aspect-ratio:1/0.92;overflow:hidden;border-radius:6px;background:#000;border:3px solid var(--gold);box-shadow:0 0 0 3px #2a0818,inset 0 0 0 2px #fff3}
#bg svg{position:absolute;inset:0;width:100%;height:100%}
#char{position:absolute;left:50%;bottom:-2%;height:100%;aspect-ratio:240/522;transform:translateX(-50%);transform-origin:50% 100%;animation:idle 3s ease-in-out infinite;z-index:2}
#char svg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 4px rgba(0,0,0,.35))}
@keyframes idle{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-1.2%)}}
#char.a-dance{animation:dance .45s ease-in-out infinite}
@keyframes dance{0%,100%{transform:translateX(-50%) rotate(-4deg) translateY(0)}50%{transform:translateX(-50%) rotate(4deg) translateY(-5%)}}
#char.a-sing{animation:sing 1s ease-in-out infinite}
@keyframes sing{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.03,1.02)}}
#char.a-rest{animation:rest 2.6s ease-in-out infinite}
@keyframes rest{0%,100%{transform:translateX(-50%) rotate(-1.5deg)}50%{transform:translateX(-50%) rotate(1.5deg)}}
#props b{position:absolute;font-size:38px;z-index:3;animation:prop 1.6s ease-in-out infinite;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
@keyframes prop{0%,100%{transform:translateY(0) rotate(-8deg) scale(1)}50%{transform:translateY(-14px) rotate(8deg) scale(1.15)}}
.tag{position:absolute;z-index:4;background:#fffdf6;border:2px solid var(--line);border-radius:6px;padding:2px 8px;font-size:11.5px;font-family:var(--fh)}
#dayTag{left:6px;top:6px;font-family:var(--fn);font-size:11px;color:var(--rose)}
#placeTag{left:6px;bottom:6px}
#moodTag{right:6px;bottom:6px}
#actTag{top:6px;left:50%;transform:translateX(-50%);display:none;font-size:14px;white-space:nowrap;background:#283050;color:#fff;border-color:var(--gold)}
.notes{position:absolute;font-size:24px;animation:note 1.5s linear infinite;opacity:0;z-index:3}
@keyframes note{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-80px) rotate(20deg)}}
#tb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:8;opacity:0}
#tb.go{animation:tbfade 1.6s ease-in-out forwards}
#tb .b{font-family:var(--fh);font-size:50px;line-height:1.1;background:linear-gradient(90deg,#ff7eb6,#ffd36e 50%,#b9a2ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #2a0818) drop-shadow(0 0 16px rgba(255,126,182,.7))}
#tb .s{font-family:var(--fh);font-size:16px;color:#fff;margin-top:6px;text-shadow:0 2px 3px #000}
#tb::before{content:'';position:absolute;left:0;right:0;top:30%;bottom:30%;background:linear-gradient(90deg,transparent,rgba(20,4,20,.7),transparent);z-index:-1}
@keyframes tbfade{0%{opacity:0;transform:scale(.9);filter:blur(5px)}22%{opacity:1;transform:scale(1);filter:blur(0)}75%{opacity:1}100%{opacity:0;transform:scale(1.05);filter:blur(3px)}}
/* 포켓몬 텍스트 박스 (장면 위) */
.pkt{position:absolute;left:6px;right:6px;bottom:6px;z-index:9;background:#fffdf6;border:4px solid var(--line);border-radius:8px;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 4px var(--line2);padding:12px 14px 14px;font-size:15.5px;line-height:1.6;min-height:74px;cursor:pointer}
.pkn{position:absolute;right:10px;bottom:4px;color:var(--rose);animation:blink .8s infinite}
@keyframes blink{50%{opacity:.15}}
/* 스탯 박스 */
.sbox{position:absolute;right:6px;top:30px;z-index:10;min-width:62%;background:#fffdf6;border:4px solid var(--line);border-radius:8px;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 4px var(--line2),4px 4px 0 rgba(0,0,0,.3);padding:10px 12px;animation:pop .25s;cursor:pointer}
.sbt{font-family:var(--fh);color:var(--rose);font-size:16px;margin-bottom:4px;text-align:center}
.sbr{display:grid;grid-template-columns:1fr 46px 46px;font-size:14px;padding:2px 0;border-bottom:1px dashed #dde}
.sbv{font-family:var(--fn);text-align:right}
.sbd{font-family:var(--fn);text-align:right;font-weight:bold}.sbd.g{color:#e0306a}.sbd.b{color:#3a6ad0}
/* 연타 */
.qte{position:absolute;inset:0;z-index:11;background:rgba(40,0,30,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.qt1{font-family:var(--fh);font-size:30px;color:#ffd36e;text-shadow:0 3px 0 #a02a62;animation:pop .3s}
.qt2{color:#fff;font-family:var(--fh);text-align:center;font-size:15px}
.qbtn{width:150px;height:150px;border-radius:50%;border:5px solid #fff;background:radial-gradient(#ff8cc0,#d9457f);color:#fff;font-family:var(--fh);font-size:30px;box-shadow:0 6px 0 #8a1a4a;touch-action:manipulation}
.qbar{width:70%;height:10px;background:#fff4;border-radius:6px;overflow:hidden}.qbar i{display:block;height:100%;background:#ffd36e}
.qcnt{font-family:var(--fn);font-size:28px;color:#fff}
/* 효과 */
.shk{animation:shk .35s}.shk2{animation:shk2 .5s}
@keyframes shk{0%,100%{transform:translate(0)}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,-1px)}}
@keyframes shk2{0%,100%{transform:translate(0)}20%{transform:translate(-9px,4px)}40%{transform:translate(8px,-5px)}60%{transform:translate(-6px,3px)}80%{transform:translate(5px,-2px)}}
.flash{position:fixed;inset:0;z-index:90;pointer-events:none;animation:fl .45s forwards}
@keyframes fl{from{opacity:.85}to{opacity:0}}
.ptc{position:fixed;z-index:91;pointer-events:none;font-size:22px;animation:ptc 1.1s ease-out forwards}
@keyframes ptc{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0}}
.ftxt{position:fixed;z-index:92;pointer-events:none;font-family:var(--fh);font-size:26px;transform:translateX(-50%);text-shadow:0 2px 0 #2a0818,0 0 8px #000;animation:ftx 1.3s ease-out forwards;white-space:nowrap}
@keyframes ftx{from{opacity:0;margin-top:10px}20%{opacity:1}to{opacity:0;margin-top:-50px}}
.coin{position:fixed;z-index:92;font-size:20px;pointer-events:none;animation:coin 1s ease-in forwards}
@keyframes coin{0%{opacity:0;transform:translateY(20px)}30%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
/* 목표·스탯 */
#goal{padding:8px 12px;display:flex;flex-direction:column;gap:4px}
#goal .gt{font-family:var(--fh);font-size:15px;display:flex;justify-content:space-between}
#goal .gt b{color:var(--rose);font-weight:normal}
#goal .gl{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;font-size:12px}
#goal .gl b{font-family:var(--fn);font-size:12px}
#goal .gh{font-size:11.5px;color:#6a7090}
.hp{display:block;height:9px;border-radius:5px;background:#3a3a4a;border:2px solid #283050;overflow:hidden}.hp i{display:block;height:100%;transition:width .5s}
#stats{padding:8px 12px;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.st{display:grid;grid-template-columns:52px 1fr 30px;align-items:center;gap:5px;font-size:12.5px}
.st .bar{height:8px;border-radius:4px;background:#e4e6f0;border:1px solid #c0c6dc;overflow:hidden}.st .bar i{display:block;height:100%;transition:width .5s}
.st b{text-align:right;font-family:var(--fn);font-size:11.5px;font-weight:normal}
.st.wide{grid-column:1/-1;grid-template-columns:52px 1fr 40px}
/* 방 메뉴 (포켓몬 시작 메뉴) */
#menu{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;z-index:5;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(#3a0c22,#1a050e);border-top:3px solid var(--gold)}
#menu .mg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#menu button{background:#fffdf6;border:3px solid var(--line);border-radius:8px;box-shadow:inset 0 0 0 2px var(--line2);padding:6px 0 5px;font-family:var(--fh);font-size:13.5px;display:flex;flex-direction:column;align-items:center}
#menu button span{font-size:20px;line-height:1.1}
#menu button.main{background:linear-gradient(#ffe0ec,#ffb6cf);border-color:var(--rose);grid-column:1/-1;flex-direction:row;justify-content:center;gap:8px;font-size:17px;padding:9px 0}
#menu button.on{background:#ffe9a8}
#menu button:active{transform:scale(.95)}
/* 맵 */
#mapwrap,#slotbar,#pad{display:none}
body.onmap #scene,body.onmap #goal,body.onmap #stats,body.onmap #menu{display:none}
body.onmap #mapwrap{display:block}body.onmap #slotbar{display:grid}body.onmap #pad{display:flex}
body.running #menu{pointer-events:none;opacity:.5}
#mapwrap{position:relative;border:3px solid var(--gold);border-radius:6px;box-shadow:0 0 0 3px #2a0818;overflow:hidden;background:#000}
#mapc{width:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#maplbl{position:absolute;inset:0;pointer-events:none}
.blbl{position:absolute;transform:translate(-50%,-50%);background:#fffdf6;border:2px solid var(--line);border-radius:4px;padding:0 5px;font-family:var(--fh);font-size:10.5px;white-space:nowrap;box-shadow:1px 1px 0 #0004}
#bmenu{position:absolute;right:6px;top:6px;width:72%;max-height:92%;overflow:auto;z-index:6;display:none;background:#fffdf6;border:4px solid var(--line);border-radius:8px;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 4px var(--line2),4px 4px 0 rgba(0,0,0,.35);padding:8px;animation:pop .2s}
#bmenu.show{display:block}
.bmh{font-family:var(--fh);font-size:16px;color:var(--rose);margin-bottom:4px}
.bml{display:flex;flex-direction:column;gap:2px}
.pkopt{background:none;border:none;text-align:left;padding:6px 4px 6px 20px;border-radius:4px;position:relative;font-size:14px}
.pkopt b{font-family:var(--fh);font-weight:normal;display:block}.pkopt small{font-size:11px;color:#6a7090}
.pkopt:hover,.pkopt:active{background:#eef0ff}
.pkopt:hover::before,.pkopt:active::before{content:'▶';position:absolute;left:4px;top:7px;color:var(--rose);font-size:12px}
.pkopt:disabled{opacity:.35}
.pkopt.free b{color:#2a7a5a}.pkopt.out b{color:#888}
.bmn{font-size:12px;color:var(--rose);margin-top:4px}
#slotbar{grid-template-columns:repeat(3,1fr) 64px;gap:5px}
.sl{background:#fffdf6;border:2px dashed #a0a8c8;border-radius:6px;padding:4px;font-size:11px;text-align:center;min-height:46px;display:flex;flex-direction:column;justify-content:center}
.sl.on{border:2px solid var(--rose);background:#fff0f6}.sl b{font-family:var(--fh);font-weight:normal;font-size:12px}.sl small{color:#8a90a8}
.sl.go{border:3px solid var(--gold);background:linear-gradient(#ff8cc0,#d9457f);color:#fff;font-family:var(--fh);font-size:14px}
.sl.go:disabled{filter:grayscale(1);opacity:.5}
#pad{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;z-index:5;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(#c8c8d8,#9a9ab0);border-top:3px solid #6a6a80;justify-content:space-between;align-items:center;border-radius:14px 14px 0 0}
.dpad{position:relative;width:132px;height:132px}
.dpad button{position:absolute;width:44px;height:44px;background:#2a2a36;border:none;color:#888;font-size:18px;touch-action:none}
.dpad .u{left:44px;top:0;border-radius:6px 6px 0 0}.dpad .d{left:44px;top:88px;border-radius:0 0 6px 6px}.dpad .l{left:0;top:44px;border-radius:6px 0 0 6px}.dpad .r{left:88px;top:44px;border-radius:0 6px 6px 0}
.dpad .c{left:44px;top:44px;background:#2a2a36;pointer-events:none}
.dpad button:active{background:#4a4a5a}
.abtns{display:flex;gap:12px;align-items:center;transform:rotate(-20deg)}
.abtns button{width:58px;height:58px;border-radius:50%;border:none;background:#a02a5a;color:#fff;font-family:var(--fn);font-size:18px;box-shadow:0 4px 0 #5a0a2a;touch-action:manipulation}
.abtns button:active{transform:translateY(3px);box-shadow:0 1px 0 #5a0a2a}
.pmid{display:flex;flex-direction:column;gap:6px;align-items:center}
.pmid button{border:none;background:#6a6a80;color:#fff;border-radius:10px;padding:5px 10px;font-family:var(--fh);font-size:12px}
/* 시트 */
.ov{position:fixed;inset:0;background:rgba(10,2,8,.72);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.show{display:flex}
.sheet{width:100%;max-width:440px;max-height:88vh;overflow:auto;background:#fffdf6;border:4px solid var(--line);border-bottom:none;border-radius:14px 14px 0 0;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 4px var(--line2);padding:14px 12px calc(16px + env(safe-area-inset-bottom))}
.sheet h2{font-family:var(--fh);font-weight:normal;margin:0 0 8px;font-size:20px;color:var(--rose);display:flex;justify-content:space-between;align-items:center}
.x{background:none;border:none;font-size:22px}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1;padding:7px;border-radius:8px;border:2px solid var(--line);background:#fff;font-family:var(--fh);font-size:14px}
.tabs button.on{background:var(--line);color:#fff}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.act{background:#fff;border:2px solid #c0c6e0;border-radius:8px;padding:7px 8px;text-align:left;font-size:12px;display:flex;flex-direction:column;gap:1px}
.act b{font-family:var(--fh);font-weight:normal;font-size:14px}.act .e{color:#6a7090;font-size:11px}.act .c{color:#a07a00;font-size:11px}.act:disabled{opacity:.38}
.cat{font-family:var(--fh);color:var(--rose);margin:10px 2px 5px;font-size:15px}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;border:2px solid #c0c6e0;border-radius:8px;padding:6px;margin-bottom:5px;font-size:12px}
.item b{font-family:var(--fh);font-weight:normal;font-size:14px;display:block}.item .ic{font-size:26px;text-align:center}
.item button{padding:6px 10px;border-radius:6px;border:2px solid var(--line);background:#fff;font-family:var(--fh)}
.kv{display:grid;grid-template-columns:86px 1fr;gap:4px 8px;font-size:13px}.kv span:nth-child(odd){color:#7a80a0}
.mcard{display:grid;grid-template-columns:110px 1fr;gap:10px;background:#fff6f0;border-radius:10px;padding:10px;border:2px solid var(--gold);margin-bottom:8px}
.mcard .lbl{font-size:11px;color:#a07a90}.mcard .mood{font-family:var(--fh);font-size:20px;padding:2px 10px;border-radius:6px;display:inline-block;color:#fff;margin:2px 0}
.ppl{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:center;border:2px solid #c0c6e0;border-radius:8px;padding:6px;margin-bottom:6px}
.ppl .pf{width:64px;height:72px;border-radius:6px;overflow:hidden;background:#fff0f6}.ppl .pf svg{width:100%;height:100%}
.ppl b{font-family:var(--fh);font-weight:normal;font-size:15px}.ppl .hr{color:#e0306a;letter-spacing:1px}.ppl small{color:#6a7090;font-size:11.5px;display:block}
.tip{font-size:12.5px;color:#6a7090;line-height:1.6}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.gal div{border:2px solid #c0c6e0;border-radius:8px;padding:8px;font-size:12px;min-height:54px}
.gal div b{font-family:var(--fh);font-weight:normal;font-size:14px;color:var(--rose);display:block}.gal div.lk{opacity:.4}
/* 다이얼로그 */
#dlg{align-items:center;padding:14px;z-index:35}
.dbox{width:100%;max-width:410px;background:#fffdf6;border:4px solid var(--line);border-radius:10px;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 4px var(--line2),0 0 0 3px var(--gold),0 10px 30px rgba(0,0,0,.5);padding:16px 16px 12px;max-height:88vh;overflow:auto;animation:pop .22s ease-out}
.dbox h3{font-family:var(--fh);font-weight:normal;margin:0 0 6px;font-size:19px;color:var(--rose)}
.dbox .sp{display:inline-block;background:var(--line);color:#fff;font-family:var(--fh);font-size:12px;padding:2px 9px;border-radius:6px;margin-bottom:6px}
.dbox p{margin:0 0 6px;font-size:14.5px;line-height:1.6;white-space:pre-line}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.chip{font-size:12px;padding:2px 8px;border-radius:10px;background:#efe8f5;color:#5a2a6a;font-weight:bold}.chip.up{background:#ffe0ec;color:#c2185b}.chip.dn{background:#e1e7f5;color:#3d5a99}
.dbtns{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.dbtns button{padding:9px 10px;border-radius:6px;border:none;background:none;font-family:var(--fh);font-size:15px;text-align:left}
.dbtns button:hover,.dbtns button:active{background:#eef0ff}
.dbtns button small{display:block;font-family:var(--fb);font-size:11.5px;color:#6a7090;margin-top:1px}
.dbox input{width:100%;padding:10px;border-radius:6px;border:3px solid var(--line2);font-size:16px;font-family:var(--fh);margin:4px 0}
/* 비주얼노벨 */
#vn{position:fixed;inset:0;z-index:30;display:none;justify-content:center;background:linear-gradient(rgba(10,2,8,.2),rgba(10,2,8,.6) 55%)}
#vn.show{display:flex}#vn.dim{visibility:hidden}
.vnw{position:relative;width:100%;max-width:440px;height:100%}
#vnTitle{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:#fffdf6;border:3px solid var(--line);box-shadow:0 0 0 2px var(--gold);border-radius:8px;padding:5px 16px;font-family:var(--fh);font-size:15px;white-space:nowrap;text-align:center;animation:pop .3s}
#vnTitle small{display:block;font-family:var(--fb);font-size:11px;color:#6a7090}
#vnPort{position:absolute;bottom:200px;width:58%;max-width:250px;aspect-ratio:148/196;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
#vnPort.l{left:2%}#vnPort.r{right:2%}
#vnPort svg{width:100%;height:100%;display:block;-webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent)}
#vnPort.pop{animation:portIn .25s ease-out}
@keyframes portIn{from{transform:translateY(12px);opacity:.3}to{transform:none;opacity:1}}
#vnBox{position:absolute;left:8px;right:8px;bottom:calc(12px + env(safe-area-inset-bottom));min-height:170px;background:#fffdf6;border:4px solid var(--line);border-radius:10px;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 4px var(--line2),0 0 0 3px var(--gold);padding:24px 16px 26px}
.vnName{position:absolute;top:-16px;left:14px;background:var(--rose);color:#fff;font-family:var(--fh);font-size:15px;padding:3px 14px;border-radius:6px;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.vnName.r{left:auto;right:14px}

/* =====================================================================
   MODERN K-POP THEME  (concept_modern/ui 참고)
   크림·파스텔 핑크·라벤더, 둥근 카드, 부드러운 그림자.
   위쪽의 예전 규칙을 덮어쓴다. 색은 여기 변수만 바꾸면 전체가 바뀐다.
   ===================================================================== */
:root{
 --fh:'Gowun Batang',serif;          /* 제목 */
 --fb:'Noto Sans KR',sans-serif;     /* 본문 */
 --fn:'Nunito','Noto Sans KR',sans-serif; /* 숫자 */
 --cream:#fbf5f1;--card:#fffdfb;--edge:#f0dcd6;--edge2:#f6e8e3;
 --ink:#4a3a3f;--mute:#9a8a8e;--pink:#ec8fa8;--rose:#d9668a;--lav:#b9a6e3;--peach:#f2bfa0;
 --gold:#e8c39a;--gold2:#b98d5e;--line:#e9cfc8;--line2:#f6e6e1;
 --sh:0 6px 20px rgba(160,100,110,.12),0 1px 3px rgba(160,100,110,.08);
}
html,body{background:#f4e9e6;font-family:var(--fb);color:var(--ink)}
#app{background:radial-gradient(circle at 15% 8%,#fff 0,transparent 40%),radial-gradient(circle at 90% 30%,#fdeef3 0,transparent 45%),linear-gradient(#fbf4f0,#f7ece8);gap:10px;padding:12px 12px 170px}
.pk{background:var(--card);border:1px solid var(--edge);border-radius:18px;box-shadow:var(--sh)}
/* 헤더 */
#hdr{padding:10px 16px 9px}
#hdr .nm{font-family:var(--fh);font-size:19px;color:var(--ink)}
#hdr .stg{font-family:var(--fb);font-weight:700;font-size:12px;color:var(--rose)}
#hdr .dt{color:var(--mute);font-size:12px}
#hdr .gold{font-family:var(--fn);font-weight:800;color:var(--gold2);font-size:14px}
#hdr::after{content:'내 상태 ›';top:-9px;right:14px;background:var(--pink);border-radius:999px;padding:1px 9px;font-family:var(--fb);font-size:10px;box-shadow:0 2px 6px rgba(217,102,138,.35)}
/* 장면 */
#scene{border:none;border-radius:22px;box-shadow:var(--sh);background:#f3e6e2;aspect-ratio:1/1.02}
.sbg{position:absolute;inset:-4%;background-size:cover;background-position:50% 45%;filter:saturate(1.02)}
.sbg.kb{animation:kb 22s ease-in-out infinite alternate}
.sbg::after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(255,248,244,.05),rgba(255,240,236,.25) 70%,rgba(250,230,226,.55))}
.stagebg{background:radial-gradient(ellipse at 50% 0%,#ffd9e8 0,#c79ad8 30%,#3b2450 75%)}
.stagebg i{position:absolute;top:-10%;width:22%;height:120%;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0));clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);animation:beam 3s ease-in-out infinite alternate;transform-origin:50% 0}
.stagebg i:nth-child(1){left:8%;transform:rotate(14deg)}.stagebg i:nth-child(2){left:39%;animation-delay:.8s}.stagebg i:nth-child(3){left:70%;transform:rotate(-14deg);animation-delay:1.4s}
@keyframes beam{from{opacity:.35}to{opacity:.9}}
#char{height:96%;bottom:0;aspect-ratio:.56}
#char .gi{filter:drop-shadow(0 10px 14px rgba(120,70,80,.22))}
.tag{background:rgba(255,253,251,.92);border:1px solid var(--edge);border-radius:999px;padding:3px 11px;font-family:var(--fb);font-weight:500;font-size:11.5px;box-shadow:0 2px 8px rgba(160,100,110,.12);backdrop-filter:blur(4px)}
#dayTag{font-family:var(--fn);font-weight:800;color:var(--rose);left:10px;top:10px}
#placeTag{left:10px;bottom:10px}#moodTag{right:10px;bottom:10px}
#actTag{background:linear-gradient(90deg,#f5a3ba,#c8a8ec);color:#fff;border:none;font-weight:700;font-size:13px;top:10px}
#tb .b{font-family:var(--fh);background:linear-gradient(90deg,#e9799b,#f2b28e 50%,#a98ee0);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 2px 0 #fff) drop-shadow(0 4px 14px rgba(217,102,138,.45))}
#tb .s{font-family:var(--fb);font-weight:700;color:#7a5560;text-shadow:0 1px 0 #fff}
#tb::before{background:linear-gradient(90deg,transparent,rgba(255,248,246,.88),transparent)}
/* 캐릭터 그림 */
.gi{display:block;width:100%;height:100%;background-repeat:no-repeat}
.gi.full{background-size:contain;background-position:50% 100%;aspect-ratio:.56}

.gi.ph b{position:relative;z-index:1;margin:0 0 8%;background:rgba(255,255,255,.88);color:var(--rose);font-family:var(--fb);font-weight:700;font-size:clamp(9px,11%,13px);padding:1px 8px;border-radius:999px;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.gi.ph.full .sil{height:62%}
/* 동료 (상반신 동그라미) */
#team .tm{height:auto;width:15%;aspect-ratio:auto;bottom:4%;filter:none;display:flex;flex-direction:column;align-items:center;gap:2px}
#team .tm .gi{width:100%;height:auto;border-radius:50%;border:3px solid #fff;box-shadow:var(--sh);aspect-ratio:1;background-size:250% auto}

.pkopt{border:1px solid var(--edge2);border-radius:14px;background:#fffafa;padding:9px 14px}

.pkopt:hover,.pkopt:active{background:#fdeef2;border-color:#f5c6d3}

.pkopt.free{background:#f6fbf7;border-color:#d8eadc}.pkopt.free b{color:#3f8a62}
.pkopt.out{background:#faf7f7}.pkopt.out b{color:#9a8a8e}
